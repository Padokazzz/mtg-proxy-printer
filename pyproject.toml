[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-proxy-printer"
version = "1.0.0"
description = "Gera PDF de proxies de Magic a partir de uma lista, usando a Scryfall API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
mtg_proxy = "mtg_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
